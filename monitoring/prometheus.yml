global:
  scrape_interval: 3s
  evaluation_interval: 3s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["servicepulse-alertmanager:9093"]

scrape_configs:
  - job_name: servicepulse
    metrics_path: /metrics
    static_configs:
      - targets: ["servicepulse-prod:8000"]

